<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>NovaChat • Neon Evolution</title>
    <style>
        /* ─── RESET & BASE ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', 'Poppins', system-ui, sans-serif;
        }

        /* ─── COLOR PALETTE ─── */
        :root {
            --neon-purple: #bf4dff;
            --purple: #9b30ff;
            --deep-purple: #7a1fa0;
            --violet: #8b00ff;
            --blue: #0088ff;
            --cyan: #00e5ff;
            --neon-green: #39ff14;
            --green: #00ff88;
            --neon-red: #ff0040;
            --dark-red: #cc0033;
            --orange: #ff6a00;
            --gold: #ffd700;
            --bright-yellow: #ffff00;
            --black: #000000;

            --bg-deep: #07070e;
            --bg-dark: #0c0c18;
            --bg-card: #111122;
            --bg-sidebar: #0a0a16;
            --bg-input: rgba(0, 0, 0, 0.55);

            --glow-purple: rgba(155, 48, 255, 0.5);
            --glow-cyan: rgba(0, 229, 255, 0.35);
            --glow-green: rgba(57, 255, 20, 0.3);
            --glow-gold: rgba(255, 215, 0, 0.4);

            --text-primary: #f0edff;
            --text-secondary: #b8b0d0;
            --text-muted: #7a7299;

            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --radius-xl: 40px;
            --radius-full: 9999px;

            --shadow-card: 0 8px 40px rgba(0, 0, 0, 0.7);
            --shadow-glow: 0 0 60px var(--glow-purple);
        }

        .light-mode {
            --bg-deep: #eceef5;
            --bg-dark: #d5d8e6;
            --bg-card: #ffffff;
            --bg-sidebar: #f0f2f8;
            --bg-input: #ffffff;

            --purple: #6c5ce7;
            --neon-purple: #8b7cf0;
            --violet: #5a4fcf;
            --neon-green: #00b894;
            --green: #00a885;
            --blue: #0984e3;
            --cyan: #00cec9;
            --gold: #fdcb6e;
            --bright-yellow: #ffeaa7;
            --neon-red: #e74c3c;
            --dark-red: #c0392b;

            --text-primary: #1e1a2e;
            --text-secondary: #4a4566;
            --text-muted: #8a85a8;

            --glow-purple: rgba(108, 92, 231, 0.25);
            --glow-cyan: rgba(0, 206, 201, 0.2);
            --glow-green: rgba(0, 184, 148, 0.2);
            --glow-gold: rgba(253, 203, 110, 0.3);

            --shadow-card: 0 8px 40px rgba(0, 0, 0, 0.1);
            --shadow-glow: 0 0 40px var(--glow-purple);
        }

        html,
        body {
            height: 100%;
        }

        body {
            display: flex;
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow: hidden;
            transition: background 0.6s ease, color 0.3s ease;
            position: relative;
        }

        /* ─── AMBIENT NEON GRID ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 10% 20%, var(--neon-purple) 1.5px, transparent 1.5px),
                radial-gradient(circle at 90% 80%, var(--cyan) 1px, transparent 1px),
                radial-gradient(circle at 50% 50%, var(--neon-green) 1px, transparent 1px),
                radial-gradient(circle at 20% 70%, var(--gold) 0.8px, transparent 0.8px),
                radial-gradient(circle at 80% 30%, var(--violet) 1.2px, transparent 1.2px);
            background-size: 60px 60px, 90px 90px, 120px 120px, 70px 70px, 100px 100px;
            opacity: 0.12;
            pointer-events: none;
            animation: floatGrid 30s linear infinite;
            z-index: 0;
        }

        .light-mode body::before {
            opacity: 0.04;
        }

        @keyframes floatGrid {
            0% {
                transform: translateY(0px) translateX(0px);
            }
            100% {
                transform: translateY(-60px) translateX(20px);
            }
        }

        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--neon-purple);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--glow-purple);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--violet);
        }

        /* ─── LOGIN SCREEN ─── */
        #login-screen {
            position: fixed;
            inset: 0;
            background: rgba(7, 7, 14, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                backdrop-filter: blur(0px);
            }
            to {
                opacity: 1;
                backdrop-filter: blur(24px);
            }
        }

        .login-card {
            background: var(--bg-card);
            padding: 44px 36px 38px;
            border-radius: var(--radius-lg);
            width: 380px;
            max-width: 92vw;
            text-align: center;
            border: 1.5px solid var(--neon-purple);
            box-shadow: 0 0 80px var(--glow-purple), 0 20px 60px rgba(0, 0, 0, 0.7);
            animation: slideUp 0.6s cubic-bezier(0.34, 1.2, 0.64, 1);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: var(--radius-lg);
            padding: 2px;
            background: linear-gradient(135deg, var(--neon-purple), var(--cyan), var(--neon-purple));
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderGlow 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes borderGlow {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px) scale(0.96);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .login-card h2 {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--neon-purple), var(--cyan), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px var(--glow-purple), 0 0 80px var(--glow-cyan);
            margin-bottom: 4px;
        }

        .login-card .version {
            color: var(--cyan);
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 18px;
        }

        .login-card input {
            width: 100%;
            padding: 14px 22px;
            border-radius: var(--radius-full);
            border: 1.5px solid rgba(155, 48, 255, 0.25);
            background: var(--bg-deep);
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }

        .login-card input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 30px var(--glow-purple), inset 0 0 20px rgba(155, 48, 255, 0.05);
        }

        .login-card input::placeholder {
            color: var(--text-muted);
        }

        .login-card button {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-full);
            border: none;
            background: linear-gradient(135deg, var(--neon-purple), var(--violet), var(--deep-purple));
            background-size: 200% 200%;
            color: #fff;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
            letter-spacing: 1px;
            animation: pulseGradient 3s ease-in-out infinite;
            box-shadow: 0 4px 30px var(--glow-purple);
        }

        @keyframes pulseGradient {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .login-card button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 50px var(--glow-purple), 0 0 80px var(--glow-purple);
        }

        .login-card button:active {
            transform: scale(0.96);
        }

        #error-msg {
            color: var(--neon-red);
            margin-top: 14px;
            font-size: 13px;
            font-weight: 500;
            text-shadow: 0 0 20px rgba(255, 0, 64, 0.3);
            min-height: 20px;
        }

        /* ─── CHAT APP LAYOUT ─── */
        #chat-app {
            display: flex;
            width: 100%;
            height: 100vh;
            animation: fadeIn 0.6s ease;
            position: relative;
            z-index: 1;
        }

        /* ─── SIDEBAR ─── */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: var(--bg-sidebar);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 20px 16px 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-right: 1px solid rgba(155, 48, 255, 0.2);
            overflow-y: auto;
            transition: all 0.3s ease;
            z-index: 2;
            box-shadow: 4px 0 40px rgba(0, 0, 0, 0.4);
        }

        .sidebar::-webkit-scrollbar {
            width: 3px;
        }

        /* ─── LOGO ─── */
        .logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--gold), var(--bright-yellow), var(--neon-purple), var(--cyan));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px var(--glow-gold), 0 0 60px var(--glow-purple);
            animation: shimmerLogo 4s ease-in-out infinite;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            padding: 6px 0;
        }

        @keyframes shimmerLogo {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .logo:hover {
            transform: scale(1.04);
            filter: brightness(1.2);
        }

        .logo.exploding {
            animation: explode 0.5s ease forwards;
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            30% {
                transform: scale(2.2);
                opacity: 0.8;
                text-shadow: 0 0 60px red, 0 0 120px orange;
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        .logo-replaced {
            font-size: 22px;
            font-weight: 800;
            color: var(--neon-green);
            text-shadow: 0 0 30px var(--neon-green), 0 0 60px var(--green), 0 0 100px var(--cyan);
            text-align: center;
            animation: neonPulse 1.2s infinite;
            padding: 6px 0;
            position: relative;
            letter-spacing: 2px;
        }

        @keyframes neonPulse {
            0%,
            100% {
                text-shadow: 0 0 20px var(--neon-green), 0 0 40px var(--green);
            }
            50% {
                text-shadow: 0 0 40px var(--neon-green), 0 0 80px var(--green), 0 0 120px var(--cyan);
            }
        }

        /* ─── STATUS ─── */
        #status {
            font-size: 12px;
            background: rgba(0, 0, 0, 0.45);
            padding: 6px 16px;
            border-radius: var(--radius-full);
            width: fit-content;
            border-left: 3px solid var(--neon-green);
            font-weight: 500;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            backdrop-filter: blur(4px);
            margin: 0 auto;
            transition: all 0.3s;
        }

        /* ─── SIDEBAR SECTIONS ─── */
        .sidebar-section {
            background: rgba(0, 0, 0, 0.35);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            border: 1px solid rgba(155, 48, 255, 0.12);
            backdrop-filter: blur(4px);
            transition: all 0.3s;
        }

        .sidebar-section h4 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--cyan);
            margin-bottom: 12px;
            font-weight: 700;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-section h4::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--neon-purple), transparent);
        }

        .online-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .online-user-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.25s;
            animation: slideInLeft 0.35s ease;
        }

        @keyframes slideInLeft {
            from {
                transform: translateX(-16px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .online-user-item:hover {
            background: rgba(155, 48, 255, 0.15);
            transform: translateX(4px);
        }

        .online-pic {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.5);
            transition: 0.2s;
        }

        .online-name {
            font-size: 13px;
            flex: 1;
            font-weight: 500;
            color: var(--text-primary);
        }

        .admin-badge,
        .mod-badge {
            font-size: 9px;
            padding: 2px 10px;
            border-radius: var(--radius-full);
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .admin-badge {
            background: linear-gradient(135deg, var(--gold), var(--bright-yellow));
            color: #000;
            box-shadow: 0 0 20px var(--glow-gold);
        }

        .mod-badge {
            background: linear-gradient(135deg, var(--cyan), var(--blue));
            color: #000;
            box-shadow: 0 0 16px var(--glow-cyan);
        }

        /* ─── SERVER / DM LISTS ─── */
        .server-item,
        .direct-message-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 12px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 3px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .server-item:hover,
        .direct-message-item:hover {
            background: rgba(155, 48, 255, 0.15);
            transform: translateX(3px);
        }

        .server-item.active,
        .direct-message-item.active {
            background: rgba(155, 48, 255, 0.25);
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 20px var(--glow-purple);
        }

        .server-item .server-icon,
        .direct-message-item .dm-icon {
            font-size: 16px;
        }
        .server-item .server-name,
        .direct-message-item .dm-partner {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .server-menu-trigger {
            font-size: 16px;
            cursor: pointer;
            padding: 0 6px;
            border-radius: 6px;
            transition: all 0.2s;
            color: var(--text-muted);
        }
        .server-menu-trigger:hover {
            background: rgba(155, 48, 255, 0.25);
            color: var(--text-primary);
        }

        .sidebar-btn {
            background: rgba(155, 48, 255, 0.12);
            border: 1px solid rgba(155, 48, 255, 0.25);
            color: var(--text-primary);
            padding: 7px 14px;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
            font-weight: 600;
            backdrop-filter: blur(4px);
            flex: 1;
            text-align: center;
        }

        .sidebar-btn:hover {
            background: var(--neon-purple);
            transform: translateY(-2px);
            box-shadow: 0 6px 30px var(--glow-purple);
            color: #fff;
        }

        .sidebar-btn:active {
            transform: scale(0.96);
        }

        /* ─── CHAT CONTAINER ─── */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-deep);
            position: relative;
        }

        .chat-container::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 80% 20%, rgba(155, 48, 255, 0.04), transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(0, 229, 255, 0.03), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ─── CHAT HEADER ─── */
        .chat-header {
            padding: 14px 28px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(155, 48, 255, 0.15);
            transition: all 0.3s ease;
            z-index: 2;
            flex-shrink: 0;
            min-height: 68px;
        }

        #current-server-label {
            color: var(--cyan);
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 20px var(--glow-cyan);
        }

        .admin-actions-top {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .top-icon-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(155, 48, 255, 0.2);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
        }

        .top-icon-btn:hover {
            background: var(--neon-purple);
            transform: scale(1.1);
            box-shadow: 0 0 30px var(--glow-purple);
            color: #fff;
            border-color: var(--neon-purple);
        }

        .star-active {
            background: linear-gradient(135deg, var(--gold), var(--bright-yellow)) !important;
            color: #000 !important;
            box-shadow: 0 0 30px var(--glow-gold) !important;
            border-color: var(--gold) !important;
        }

        #theme-toggle {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(155, 48, 255, 0.2);
            color: var(--bright-yellow);
            font-size: 18px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            animation: rotateIn 0.5s ease;
        }

        #theme-toggle:hover {
            background: var(--neon-purple);
            transform: scale(1.1) rotate(20deg);
            box-shadow: 0 0 30px var(--glow-purple);
            color: #fff;
        }

        @keyframes rotateIn {
            from {
                transform: rotate(-180deg);
                opacity: 0;
            }
            to {
                transform: rotate(0deg);
                opacity: 1;
            }
        }

        /* ─── MESSAGES AREA ─── */
        #messages {
            flex: 1;
            padding: 20px 28px 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 1;
            background: transparent;
        }

        #messages::-webkit-scrollbar {
            width: 4px;
        }

        /* ─── MESSAGE BUBBLES ─── */
        .message {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            max-width: 82%;
            animation: messageIn 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
            position: relative;
        }

        @keyframes messageIn {
            0% {
                opacity: 0;
                transform: translateY(18px) scale(0.95);
            }
            60% {
                transform: translateY(-4px) scale(1.01);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .left {
            align-items: flex-start;
            align-self: flex-start;
        }
        .right {
            align-items: flex-end;
            align-self: flex-end;
        }

        .message-content {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
        }

        .profile-pic {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 16px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }

        .profile-pic:hover {
            transform: scale(1.15) rotate(6deg);
        }

        .admin-glow {
            box-shadow: 0 0 20px var(--gold), 0 0 40px var(--glow-gold) !important;
            border: 2px solid var(--gold);
        }

        .mod-glow {
            box-shadow: 0 0 20px var(--cyan), 0 0 40px var(--glow-cyan) !important;
            border: 2px solid var(--cyan);
        }

        .message-text-container {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .username-label {
            font-weight: 700;
            margin-bottom: 4px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        .left .username-label {
            justify-content: flex-start;
        }
        .right .username-label {
            justify-content: flex-end;
        }

        .crown-icon {
            color: var(--gold);
            filter: drop-shadow(0 0 6px var(--gold));
        }

        .timestamp {
            font-size: 9px;
            color: var(--text-muted);
            margin-left: 6px;
            font-weight: 400;
            opacity: 0.7;
        }

        .bubble {
            padding: 10px 18px;
            border-radius: var(--radius-md);
            word-wrap: break-word;
            line-height: 1.5;
            display: inline-block;
            max-width: 100%;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 0.93rem;
            backdrop-filter: blur(4px);
            position: relative;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
        }

        .left .bubble {
            background: linear-gradient(135deg, rgba(20, 20, 40, 0.85), rgba(10, 10, 25, 0.9));
            border-bottom-left-radius: 4px;
            border-left: 3px solid var(--cyan);
            box-shadow: 0 2px 16px rgba(0, 229, 255, 0.06);
        }

        .right .bubble {
            background: linear-gradient(135deg, var(--neon-purple), var(--violet));
            border-bottom-right-radius: 4px;
            border-right: 3px solid var(--neon-green);
            color: #fff;
            box-shadow: 0 2px 24px var(--glow-purple);
        }

        .bubble:hover {
            transform: scale(1.02);
            filter: brightness(1.05);
        }

        /* ─── MEDIA IN MESSAGES ─── */
        .message-media {
            max-width: 280px;
            max-height: 220px;
            width: auto;
            height: auto;
            border-radius: var(--radius-sm);
            margin-top: 2px;
            border: 1px solid rgba(155, 48, 255, 0.25);
            animation: scaleIn 0.4s ease;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ─── DELETE WARNING ─── */
        .delete-warning {
            position: absolute;
            top: -32px;
            background: linear-gradient(135deg, var(--neon-red), var(--dark-red));
            color: #fff;
            padding: 3px 14px;
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
            z-index: 100;
            box-shadow: 0 4px 24px rgba(255, 0, 64, 0.4);
            animation: warningPop 0.2s ease;
            pointer-events: none;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes warningPop {
            from {
                opacity: 0;
                transform: translateY(6px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ─── TYPING INDICATOR ─── */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: var(--radius-full);
            width: fit-content;
            margin-bottom: 10px;
            animation: fadeInUp 0.3s ease;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 229, 255, 0.08);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .typing-indicator span {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }
        .typing-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--cyan);
            animation: typingDot 1.4s infinite;
            box-shadow: 0 0 12px var(--glow-cyan);
        }
        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingDot {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.3;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        /* ─── INPUT AREA ─── */
        .input-area {
            padding: 14px 28px 18px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(155, 48, 255, 0.12);
            transition: all 0.3s ease;
            z-index: 2;
            flex-shrink: 0;
            align-items: center;
        }

        #message-input {
            flex: 1;
            padding: 12px 22px;
            border-radius: var(--radius-full);
            border: 1.5px solid rgba(155, 48, 255, 0.15);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s;
            outline: none;
            backdrop-filter: blur(4px);
        }

        #message-input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 30px var(--glow-green), inset 0 0 20px rgba(57, 255, 20, 0.03);
        }

        #message-input::placeholder {
            color: var(--text-muted);
        }

        .emoji-btn,
        .attach-btn,
        .gif-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(155, 48, 255, 0.15);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            backdrop-filter: blur(4px);
        }

        .emoji-btn:hover,
        .attach-btn:hover,
        .gif-btn:hover {
            background: var(--neon-purple);
            transform: scale(1.1);
            box-shadow: 0 0 30px var(--glow-purple);
            border-color: var(--neon-purple);
        }

        #send-btn {
            padding: 0 28px;
            height: 46px;
            border-radius: var(--radius-full);
            border: none;
            background: linear-gradient(135deg, var(--neon-purple), var(--violet));
            background-size: 200% 200%;
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            animation: pulseGradient 3s ease-in-out infinite;
            box-shadow: 0 4px 30px var(--glow-purple);
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }

        #send-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 0 50px var(--glow-purple), 0 0 80px var(--glow-purple);
        }

        #send-btn:active {
            transform: scale(0.95);
        }

        /* ─── ATTACHMENT PREVIEW ─── */
        .attachment-preview {
            padding: 6px 28px 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.25);
            border-top: 1px solid rgba(155, 48, 255, 0.08);
            flex-wrap: wrap;
            backdrop-filter: blur(8px);
        }

        .attachment-preview img,
        .attachment-preview video {
            max-height: 72px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--neon-purple);
            animation: scaleIn 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .attachment-preview .remove-preview {
            background: var(--neon-red);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 0, 64, 0.3);
        }

        .attachment-preview .remove-preview:hover {
            transform: scale(1.15);
            box-shadow: 0 0 40px rgba(255, 0, 64, 0.5);
        }

        /* ─── ADMIN DRAWER ─── */
        .admin-drawer {
            width: 0;
            overflow-x: hidden;
            background: var(--bg-sidebar);
            backdrop-filter: blur(16px);
            border-left: 1px solid rgba(155, 48, 255, 0.15);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 3;
            box-shadow: -4px 0 40px rgba(0, 0, 0, 0.3);
        }

        .admin-drawer.open {
            width: 340px;
            padding: 20px 16px;
            overflow-y: auto;
        }

        .admin-drawer::-webkit-scrollbar {
            width: 3px;
        }

        .admin-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            margin-bottom: 14px;
            border: 1px solid rgba(155, 48, 255, 0.1);
            animation: slideInRight 0.4s ease;
            backdrop-filter: blur(4px);
        }

        @keyframes slideInRight {
            from {
                transform: translateX(16px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .admin-section h4 {
            color: var(--cyan);
            margin-bottom: 12px;
            border-left: 3px solid var(--neon-purple);
            padding-left: 12px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .admin-btn {
            background: rgba(155, 48, 255, 0.12);
            border: 1px solid rgba(155, 48, 255, 0.2);
            color: var(--text-primary);
            padding: 7px 16px;
            border-radius: var(--radius-full);
            cursor: pointer;
            margin: 4px 4px 4px 0;
            transition: all 0.3s;
            font-size: 12px;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }

        .admin-btn:hover {
            background: var(--neon-purple);
            transform: translateY(-2px);
            box-shadow: 0 6px 30px var(--glow-purple);
            color: #fff;
        }

        .admin-btn.danger {
            border-color: var(--neon-red);
        }
        .admin-btn.danger:hover {
            background: var(--neon-red);
            box-shadow: 0 6px 30px rgba(255, 0, 64, 0.4);
        }

        .admin-input {
            background: var(--bg-deep);
            border: 1px solid rgba(155, 48, 255, 0.12);
            padding: 9px 16px;
            border-radius: var(--radius-full);
            color: var(--text-primary);
            width: 100%;
            margin-bottom: 8px;
            transition: all 0.3s;
            outline: none;
            font-size: 13px;
        }

        .admin-input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px var(--glow-purple);
        }

        .word-badge {
            background: rgba(155, 48, 255, 0.1);
            border-radius: var(--radius-full);
            padding: 4px 12px 4px 16px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 3px 4px 3px 0;
            border: 1px solid rgba(155, 48, 255, 0.15);
            animation: fadeIn 0.3s ease;
            color: var(--text-secondary);
        }

        .word-badge .remove-word {
            background: transparent;
            border: none;
            color: var(--neon-red);
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s;
            padding: 0 2px;
        }

        .word-badge .remove-word:hover {
            transform: scale(1.3);
            color: #fff;
            text-shadow: 0 0 20px var(--neon-red);
        }

        /* ─── EMOJI PICKER ─── */
        .emoji-picker-popup {
            position: absolute;
            bottom: 76px;
            left: 20px;
            z-index: 1000;
            animation: slideUp 0.2s ease;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: 0 0 60px var(--glow-purple), 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--neon-purple);
        }

        .emoji-picker-popup emoji-picker {
            --background: var(--bg-card);
            --border-color: transparent;
            --category-emoji-size: 1.2rem;
            --emoji-size: 1.4rem;
            --indicator-color: var(--neon-purple);
            --input-border-color: rgba(155, 48, 255, 0.2);
            --input-background: var(--bg-deep);
            --input-font-color: var(--text-primary);
            --search-background: var(--bg-deep);
            --search-font-color: var(--text-primary);
            --search-placeholder-color: var(--text-muted);
            --secondary-font-color: var(--text-secondary);
            width: 350px;
            height: 400px;
        }

        /* ─── MODALS ─── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 12, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }

        .account-modal,
        .server-modal {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 32px 28px 28px;
            width: 400px;
            max-width: 92vw;
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
            border: 1.5px solid var(--neon-purple);
            box-shadow: 0 0 80px var(--glow-purple);
            animation: slideUp 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        .account-modal h3,
        .server-modal h3 {
            font-size: 22px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--neon-purple), var(--cyan));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .profile-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 16px;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            font-weight: 700;
            border: 3px solid var(--gold);
            box-shadow: 0 0 40px var(--glow-purple), 0 0 80px var(--glow-gold);
            transition: all 0.3s;
        }

        .color-picker-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 14px 0;
            max-height: 80px;
            overflow-y: auto;
            padding: 4px;
        }

        .color-option {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
        }

        .color-option.selected {
            border-color: #fff;
            transform: scale(1.15);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .upload-btn,
        .rgb-btn {
            background: rgba(155, 48, 255, 0.12);
            border: 1px solid rgba(155, 48, 255, 0.2);
            padding: 8px 18px;
            border-radius: var(--radius-full);
            cursor: pointer;
            margin: 4px;
            color: var(--text-primary);
            font-weight: 600;
            transition: all 0.3s;
            font-size: 13px;
        }

        .upload-btn:hover,
        .rgb-btn:hover {
            background: var(--cyan);
            color: #000;
            transform: scale(1.04);
            box-shadow: 0 0 30px var(--glow-cyan);
            border-color: var(--cyan);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        .save-btn {
            flex: 1;
            background: linear-gradient(135deg, var(--neon-green), var(--green));
            border: none;
            padding: 11px;
            border-radius: var(--radius-full);
            color: #000;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
            box-shadow: 0 4px 24px var(--glow-green);
        }

        .save-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 40px var(--glow-green), 0 0 80px var(--glow-green);
        }

        .cancel-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--neon-red);
            padding: 11px;
            border-radius: var(--radius-full);
            color: var(--text-primary);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
        }

        .cancel-btn:hover {
            background: var(--neon-red);
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(255, 0, 64, 0.3);
        }

        /* ─── PROFILE POPUP ─── */
        .profile-popup {
            position: fixed;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 18px 22px 16px;
            text-align: center;
            z-index: 2001;
            pointer-events: auto;
            border: 1.5px solid var(--gold);
            box-shadow: 0 0 60px var(--glow-gold), 0 20px 60px rgba(0, 0, 0, 0.6);
            animation: fadeInUp 0.2s ease;
            backdrop-filter: blur(16px);
            min-width: 160px;
        }

        /* ─── PERMISSION TOGGLES ─── */
        .permission-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 5px 0;
            gap: 12px;
        }

        .permission-toggle label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .toggle-switch {
            position: relative;
            width: 38px;
            height: 20px;
            flex-shrink: 0;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #2a2a3e;
            transition: 0.3s;
            border-radius: 20px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        .slider::before {
            position: absolute;
            content: '';
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background: #fff;
            transition: 0.3s;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        input:checked+.slider {
            background: var(--neon-purple);
            box-shadow: 0 0 20px var(--glow-purple);
        }
        input:checked+.slider::before {
            transform: translateX(18px);
        }

        /* ─── GIF MODAL ─── */
        .gif-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 12, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            animation: fadeIn 0.3s ease;
        }

        .gif-modal {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 24px 24px 20px;
            width: 520px;
            max-width: 94vw;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            border: 1.5px solid var(--neon-purple);
            box-shadow: 0 0 80px var(--glow-purple);
            animation: slideUp 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        .gif-modal h3 {
            color: var(--cyan);
            margin-bottom: 12px;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .gif-search {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .gif-search input {
            flex: 1;
            padding: 10px 18px;
            border-radius: var(--radius-full);
            border: 1px solid rgba(155, 48, 255, 0.15);
            background: var(--bg-deep);
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s;
        }

        .gif-search input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px var(--glow-purple);
        }

        .gif-search button {
            background: linear-gradient(135deg, var(--neon-purple), var(--violet));
            border: none;
            color: #fff;
            border-radius: var(--radius-full);
            padding: 0 24px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 4px 20px var(--glow-purple);
        }

        .gif-search button:hover {
            transform: scale(1.04);
            box-shadow: 0 0 40px var(--glow-purple);
        }

        .gif-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            overflow-y: auto;
            max-height: 360px;
            padding-right: 4px;
        }

        .gif-grid::-webkit-scrollbar {
            width: 3px;
        }

        .gif-item {
            cursor: pointer;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 2px solid transparent;
            transition: 0.3s;
            animation: scaleIn 0.3s ease;
            background: rgba(0, 0, 0, 0.2);
        }

        .gif-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: 0.3s;
        }

        .gif-item:hover {
            border-color: var(--neon-purple);
            box-shadow: 0 0 30px var(--glow-purple);
            transform: scale(1.05);
            z-index: 2;
        }

        /* ─── PASSWORD MODAL ─── */
        .password-modal-content {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 32px 28px 28px;
            width: 380px;
            max-width: 92vw;
            text-align: center;
            border: 1.5px solid var(--neon-purple);
            box-shadow: 0 0 80px var(--glow-purple);
            animation: slideUp 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        .password-modal-content h3 {
            color: var(--cyan);
            margin-bottom: 8px;
            font-size: 20px;
        }

        .password-modal-content p {
            color: var(--text-secondary);
            margin-bottom: 14px;
            font-size: 14px;
        }

        .password-modal-content input {
            width: 100%;
            padding: 12px 20px;
            border-radius: var(--radius-full);
            border: 1px solid rgba(155, 48, 255, 0.15);
            background: var(--bg-deep);
            color: var(--text-primary);
            font-size: 1rem;
            margin: 8px 0 16px;
            transition: all 0.3s;
            outline: none;
        }

        .password-modal-content input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 30px var(--glow-purple);
        }

        .password-modal-content .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        /* ─── CONTEXT MENU ─── */
        .context-menu {
            position: fixed;
            background: var(--bg-card);

        }

        /* ─── SPARKLE / THUNDER (animations) ─── */
        .sparkle {
            position: fixed;
            font-size: 20px;
            pointer-events: none;
            animation: sparkleFloat 1s ease-out forwards;
            z-index: 9999;
        }

        @keyframes sparkleFloat {
            0% {
                opacity: 1;
                transform: scale(1) translate(0, 0);
            }
            100% {
                opacity: 0;
                transform: scale(0.4) translate(var(--tx, 0), var(--ty, -50px));
            }
        }

        .thunderbolt {
            position: fixed;
            background: linear-gradient(135deg, var(--bright-yellow), var(--gold), #fff);
            clip-path: polygon(50% 0%, 40% 40%, 60% 40%, 45% 60%, 55% 60%, 35% 100%, 50% 70%, 40% 70%, 60% 30%);
            animation: thunderFlash 0.08s linear infinite, thunderMove 3s ease-out forwards;
            z-index: 10000;
            pointer-events: none;
            filter: drop-shadow(0 0 30px var(--gold));
        }

        @keyframes thunderFlash {
            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 30px var(--gold), 0 0 60px var(--bright-yellow);
            }
            50% {
                opacity: 0.6;
                box-shadow: 0 0 60px #fff, 0 0 120px var(--gold);
            }
        }

        @keyframes thunderMove {
            0% {
                transform: translateX(-100px) translateY(-100px) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateX(calc(100vw + 200px)) translateY(calc(100vh + 200px)) scale(0.4);
                opacity: 0;
            }
        }

        .explosion-particle {
            position: fixed;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--neon-red), var(--gold), var(--bright-yellow));
            pointer-events: none;
            z-index: 10001;
            animation: particleExplode 0.8s ease-out forwards;
            box-shadow: 0 0 20px var(--gold);
        }

        @keyframes particleExplode {
            0% {
                transform: scale(1) translate(0, 0);
                opacity: 1;
            }
            100% {
                transform: scale(0) translate(var(--px, 0), var(--py, 0));
                opacity: 0;
            }
        }

        .screen-shake {
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px) rotate(-0.5deg);
            }
            75% {
                transform: translateX(6px) rotate(0.5deg);
            }
        }

        const GIPHY_API_KEY = "dc6zaTOxFJmzC";

        let currentUser = "";

        // ─── PASSWORD MODAL ───
        function showPasswordModal(title, message) {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                    <div class="password-modal-content">
                        <h3>${title}</h3>
                        <p style="color:var(--text-secondary);margin-bottom:12px;">${message}</p>
                        <input type="password" id="password-input" placeholder="Enter password" autocomplete="off">
                        <div class="modal-buttons">
                            <button id="password-cancel" class="cancel-btn">Cancel</button>
                            <button id="password-submit" class="save-btn">Submit</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(overlay);
                const input = overlay.querySelector('#password-input');
                const submitBtn = overlay.querySelector('#password-submit');
                const cancelBtn = overlay.querySelector('#password-cancel');
                const cleanup = () => overlay.remove();
                const submit = () => {
                    const value = input.value.trim();
                    cleanup();
                    resolve(value);
                };
                submitBtn.addEventListener('click', submit);
                cancelBtn.addEventListener('click', () => { cleanup();
                    resolve(null); });
                input.addEventListener('keypress', (e) => { if (e.key === 'Enter') submit(); });
                setTimeout(() => input.focus(), 100);
            });
        }

        // ─── THEME ───
        function initTheme() {
            const saved = localStorage.getItem('novachat-theme');
            if (saved === 'light') {
                document.body.classList.add('light-mode');
                themeToggle.textContent = '☀️';
            } else {
                document.body.classList.remove('light-mode');
                themeToggle.textContent = '🌙';
            }
        }
        initTheme();
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('novachat-theme', isLight ? 'light' : 'dark');
            themeToggle.textContent = isLight ? '☀️' : '🌙';
        });

        // ─── HELPERS ───
        function escapeHtml(s) { return s?.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' } [m])) || ''; }

        function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

        async function loadProfiles() {
            const snap = await get(usersRef);
            if (snap.exists()) snap.forEach(c => userProfiles.set(c.key, c.val()));
        }

        async function saveProfile(username, profile) {
            await set(ref(db, `userProfiles/${username}`), profile);
            userProfiles.set(username, profile);
        }

        function getProfile(username) {
            return userProfiles.get(username) || { name: username, avatarColor: "#9b30ff", avatarUrl: null };
        }

        async function deleteMessage(key) { await remove(ref(db, `messages/${key}`)); }

        function triggerExplosionAndThunder() {
            document.body.classList.add('screen-shake');
            setTimeout(() => document.body.classList.remove('screen-shake'), 300);
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'explosion-particle';
                const angle = Math.random() * Math.PI * 2;
                const distance = 100 + Math.random() * 200;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                particle.style.setProperty('--px', `${tx}px`);
                particle.style.setProperty('--py', `${ty}px`);
                particle.style.left = `${window.innerWidth / 2 + (Math.random() - 0.5) * 100}px`;
                particle.style.top = `${window.innerHeight / 2 + (Math.random() - 0.5) * 100}px`;
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 800);
            }
            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    const thunder = document.createElement('div');
                    thunder.className = 'thunderbolt';
                    const startX = Math.random() * window.innerWidth;
                    const startY = Math.random() * window.innerHeight;
                    const size = 30 + Math.random() * 40;
                    thunder.style.width = `${size}px`;
                    thunder.style.height = `${size * 1.5}px`;
                    thunder.style.left = `${startX}px`;
                    thunder.style.top = `${startY}px`;
                    thunder.style.transform = `rotate(${Math.random() * 360}deg)`;
                    document.body.appendChild(thunder);
                    setTimeout(() => thunder.remove(), 3000);
                }, i * 100);
            }
            const replacedElement = document.querySelector('.logo-replaced');
            if (replacedElement) {
                for (let i = 0; i < 30; i++) {
                    setTimeout(() => {
                        const sparkle = document.createElement('div');
                        sparkle.className = 'sparkle';
                        sparkle.innerText = ['✨', '⭐', '💫', '🌟', '⚡', '💥'][Math.floor(Math.random() * 6)];
                        const angle = Math.random() * Math.PI * 2;
                        const radius = 40 + Math.random() * 60;
                        const tx = Math.cos(angle) * radius;
                        const ty = Math.sin(angle) * radius - 30;
                        sparkle.style.setProperty('--tx', `${tx}px`);
                        sparkle.style.setProperty('--ty', `${ty}px`);
                        const rect = replacedElement.getBoundingClientRect();
                        sparkle.style.left = `${rect.left + rect.width / 2}px`;
                        sparkle.style.top = `${rect.top + rect.height / 2}px`;
                        document.body.appendChild(sparkle);
                        setTimeout(() => sparkle.remove(), 1000);
                    }, i * 80);
                }
            }

        function renderMessage(key, msg) {
            if (messageElements.has(key)) messageElements.get(key)?.remove();
            const profile = getProfile(msg.username);
            const wrapper = document.createElement('div');
            wrapper.className = `message ${msg.username === currentUser ? 'right' : 'left'}`;
            wrapper.dataset.key = key;

            const content = document.createElement('div');
            content.className = 'message-content';

            const pic = document.createElement('div');
            pic.className = 'profile-pic';
            if (msg.username === 'Johan06') pic.classList.add('admin-glow');
            else if (moderatorUsernames.has(msg.username)) pic.classList.add('mod-glow');
            if (profile.avatarUrl) {
                pic.style.backgroundImage = `url(${profile.avatarUrl})`;
                pic.style.backgroundSize = 'cover';
                pic.innerText = '';
            } else {
                pic.style.background = profile.avatarColor;
                pic.innerText = msg.username === 'Johan06' ? 'J' : msg.username.charAt(0).toUpperCase();
            }
            pic.onclick = (e) => { e.stopPropagation();
                showProfilePopup(msg.username, profile, e.target); };

            const textCont = document.createElement('div');
            textCont.className = 'message-text-container';

            const nameDiv = document.createElement('div');
            nameDiv.className = 'username-label';
            const timestampSpan = document.createElement('span');
            timestampSpan.className = 'timestamp';
            timestampSpan.innerText = formatTime(msg.time);
            if (msg.username === 'Johan06') {
                nameDiv.innerHTML = `<span class="crown-icon">👑</span> ${escapeHtml(msg.username)}`;
                nameDiv.appendChild(timestampSpan);
            } else {
                nameDiv.innerText = msg.username;
                nameDiv.appendChild(timestampSpan);
            }

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (msg.type === 'image' || msg.type === 'gif') {
                const img = document.createElement('img');
                img.src = msg.url || msg.text;
                img.className = 'message-media';
                bubble.appendChild(img);
            } else if (msg.type === 'video') {
                const video = document.createElement('video');
                video.src = msg.url || msg.text;
                video.className = 'message-media';
                video.controls = true;
                video.muted = true;
                video.loop = true;
                video.autoplay = true;
                bubble.appendChild(video);
            } else {
                bubble.innerText = msg.text;
            }

            if (msg.username === currentUser && !isAdminMode) {
                bubble.style.cursor = 'pointer';
                bubble.onclick = async (e) => {
                    e.stopPropagation();
                    if (pendingDeleteKey === key) {
                        const warning = wrapper.querySelector('.delete-warning');
                        if (warning) warning.remove();
                        if (deleteTimeout) clearTimeout(deleteTimeout);
                        pendingDeleteKey = null;
                        await deleteMessage(key);
                    } else {
                        const existingWarning = wrapper.querySelector('.delete-warning');
                        if (existingWarning) existingWarning.remove();
                        const warning = document.createElement('div');
                        warning.className = 'delete-warning';
                        warning.innerText = '⚠️ Click again to delete ⚠️';
                        wrapper.appendChild(warning);
                        pendingDeleteKey = key;
                        deleteTimeout = setTimeout(() => {
                            const warn = wrapper.querySelector('.delete-warning');
                            if (warn) warn.remove();
                            pendingDeleteKey = null;
                        }, 3000);
                    }
                };
            }

            textCont.appendChild(nameDiv);
            textCont.appendChild(bubble);
            content.appendChild(pic);
            content.appendChild(textCont);
            wrapper.appendChild(content);
            messagesDiv.appendChild(wrapper);
            messageElements.set(key, wrapper);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ─── ACCOUNT MODAL ───
        function openAccountModal() {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            const presetColors = ['#9b30ff', '#bf4dff', '#8b00ff', '#39ff14', '#00ff88', '#0088ff', '#00e5ff', '#ffd700',
                '#ffff00', '#ff3333', '#ff0040', '#000000', '#1a1a24'
            ];
            let selectedColor = currentUserProfile.avatarColor || '#9b30ff';
            let uploadedImage = null;
            modal.innerHTML =
                `<div class="account-modal"><h3>✨ EDIT PROFILE ✨</h3><div class="profile-preview" id="preview" style="background:${currentUserProfile.avatarUrl ? `url(${currentUserProfile.avatarUrl}) center/cover` : selectedColor}">${!currentUserProfile.avatarUrl ? (currentUser === 'Johan06' ? 'J' : currentUser.charAt(0).toUpperCase()) : ''}</div><button id="uploadBtn" class="upload-btn">📷 UPLOAD PICTURE</button><input type="file" id="fileInput" accept="image/*" style="display:none"><div class="color-picker-row" id="presetRow"></div><button id="rgbBtn" class="rgb-btn">🎨 RGB COLOR WHEEL</button><div id="rgbPicker" style="display:none"><input type="color" id="colorWheel" value="${selectedColor}"></div><input type="text" id="newName" placeholder="New username" value="${escapeHtml(currentUser)}"><div class="modal-buttons"><button id="saveBtn" class="save-btn">💾 SAVE CHANGES</button><button id="closeBtn" class="cancel-btn">❌ CANCEL</button></div></div>`;
            const preview = modal.querySelector('#preview');
            const presetRow = modal.querySelector('#presetRow');
            presetColors.forEach(c => {
                const btn = document.createElement('div');
                btn.className = 'color-option';
                btn.style.background = c;
                if (c === selectedColor && !currentUserProfile.avatarUrl) btn.classList.add('selected');
                btn.onclick = () => {
                    modal.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedColor = c;
                    if (!uploadedImage) { preview.style.background = c;
                        preview.innerText = currentUser === 'Johan06' ? 'J' : currentUser.charAt(0);
                        preview.style.backgroundImage = 'none'; }
                };
                presetRow.appendChild(btn);
            });
            const rgbBtn = modal.querySelector('#rgbBtn');
            const rgbDiv = modal.querySelector('#rgbPicker');
            const colorWheel = modal.querySelector('#colorWheel');
            rgbBtn.onclick = () => rgbDiv.style.display = rgbDiv.style.display === 'none' ? 'block' : 'none';
            colorWheel.oninput = (e) => { selectedColor = e.target.value; if (!uploadedImage) { preview.style
                        .background = selectedColor;
                    preview.innerText = currentUser === 'Johan06' ? 'J' : currentUser.charAt(0);
                    preview.style.backgroundImage = 'none'; } };
            const uploadBtn = modal.querySelector('#uploadBtn');
            const fileInputModal = modal.querySelector('#fileInput');
            uploadBtn.onclick = () => fileInputModal.click();
            fileInputModal.onchange = (e) => {
                const file = e.target.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (ev) => { uploadedImage = ev.target.result;
                        preview.style.backgroundImage = `url(${uploadedImage})`;
                        preview.style.backgroundSize = 'cover';
                        preview.innerText = ''; };
                    reader.readAsDataURL(file);
                }
            };
            modal.querySelector('#saveBtn').onclick = async () => {
                const newName = modal.querySelector('#newName').value.trim();
                if (newName && newName !== currentUser) {
                    if (newName === 'Johan06') {
                        const code = await showPasswordModal('Admin Verification', 'Enter the master code:');
                        if (code !== 'PurpleMania') { alert('Invalid code!');
                            modal.remove(); return; }
                    }
                    const modSnap = await get(moderatorsRef);
                    if (modSnap.exists() && modSnap.hasChild(newName)) { alert('Name reserved for moderator.');
                        modal.remove(); return; }
                    const snap = await get(messagesRef);
                    let taken = false;
                    snap.forEach(c => { if (c.val().username === newName && c.val().username !== currentUser) taken =
                            true; });
                    if (taken && newName !== 'Johan06') { alert('Name taken'); return; }
                    const updates = {};
                    snap.forEach(c => { if (c.val().username === currentUser) updates[c.key] = { ...c.val(),
                            username: newName }; });
                    for (let key in updates) await set(ref(db, `messages/${key}`), updates[key]);
                    const oldProfile = getProfile(currentUser);
                    await saveProfile(newName, { ...oldProfile, name: newName });
                    await remove(ref(db, `userProfiles/${currentUser}`));
                    currentUser = newName;
                    if (currentUser === 'Johan06') starToggle.style.display = 'flex';
                    else starToggle.style.display = 'none';
                }
                const newProfile = { name: currentUser, avatarColor: selectedColor, avatarUrl: uploadedImage ||
                        currentUserProfile.avatarUrl || null };
                await saveProfile(currentUser, newProfile);
                currentUserProfile = newProfile;
                modal.remove();
            };
            modal.querySelector('#closeBtn').onclick = () => modal.remove();
            document.body.appendChild(modal);
        }

        function attachAdminEventListeners() {
            const clearBtn = document.getElementById('clear-all-msgs');
            if (clearBtn && hasPermission('clearChat')) clearBtn.addEventListener('click', async () => {
                const targetRef = currentDmId ? ref(db, `directMessages/${currentDmId}/messages`) : (currentServerId ?
                    ref(db, `serverMessages/${currentServerId}`) : messagesRef);
                if (confirm('Clear all messages?')) await remove(targetRef);
            });

            const delUserBtn = document.getElementById('delete-user-msgs');
            if (delUserBtn && hasPermission('deleteUserMsgs')) delUserBtn.addEventListener('click', async () => {
                const user = document.getElementById('target-username')?.value.trim();
                if (!user) return;
                const targetRef = currentDmId ? ref(db, `directMessages/${currentDmId}/messages`) : (currentServerId ?
                    ref(db, `serverMessages/${currentServerId}`) : messagesRef);
                const snap = await get(targetRef);
                const deletions = [];
                snap.forEach(c => {
                    if (c.val().username === user) deletions.push(remove(ref(db,
                        `${currentDmId ? 'directMessages/'+currentDmId+'/messages' : (currentServerId ? 'serverMessages/'+currentServerId : 'messages')}/${c.key}`
                        )));

        function generateServerCode() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();

        async function joinServerById(serverId, serverData) {
            if (joinedServers.has(serverId)) return;
            joinedServers.set(serverId, serverData);
            await set(ref(db, `serverMembers/${serverId}/${currentUser}`), true);
            renderSidebarLists();
            if (!currentServerId && !currentDmId) switchServer(serverId);
        }

        async function switchServer(serverId) {
            if (activeMessageListener) {
                activeMessageListener();
                activeMessageListener = null;
            }
            messagesDiv.innerHTML = '';
            messageElements.clear();
            currentDmId = null;
            currentDmPartner = null;

            currentServerId = serverId;
            if (!serverId) {
                currentServerLabel.textContent = '💬 GLOBAL NEXUS';
                const unsubAdded = onChildAdded(messagesRef, async (snap) => {
                    await loadProfiles();
                    renderMessage(snap.key, snap.val());
                });
                const unsubRemoved = onChildRemoved(messagesRef, (snap) => {
                    const el = messageElements.get(snap.key);
                    if (el) el.remove();
                    messageElements.delete(snap.key);
                });
                activeMessageListener = () => { unsubAdded();
                    unsubRemoved(); };
                const snap = await get(messagesRef);
                snap.forEach(c => renderMessage(c.key, c.val()));
            } else {
                const server = joinedServers.get(serverId);
                currentServerLabel.textContent = `🌐 ${server?.name || 'Server'}`;
                const msgsRef = ref(db, `serverMessages/${serverId}`);
                const unsubAdded = onChildAdded(msgsRef, async (snap) => {
                    await loadProfiles();
                    renderMessage(snap.key, snap.val());
                });
                const unsubRemoved = onChildRemoved(msgsRef, (snap) => {
                    const el = messageElements.get(snap.key);
                    if (el) el.remove();
                    messageElements.delete(snap.key);
                });
                activeMessageListener = () => { unsubAdded();
                    unsubRemoved(); };
                const snap = await get(msgsRef);
                snap.forEach(c => renderMessage(c.key, c.val()));
            }
            renderSidebarLists();
        }

        function showServerContextMenu(event, serverId, serverData) {
            document.querySelectorAll('.context-menu').forEach(m => m.remove());

            const menu = document.createElement('div');
            menu.className = 'context-menu';
            menu.style.left = `${event.clientX}px`;
            menu.style.top = `${event.clientY}px`;

            const canDelete = userRole === 'admin' || currentUser === serverData.createdBy || hasPermission(
            'deleteUserMsgs');
            const canToggle = userRole === 'admin' || currentUser === serverData.createdBy;

            if (canDelete) {
                const deleteBtn = document.createElement('button');
                deleteBtn.textContent = '🗑️ Delete Chat';
                deleteBtn.addEventListener('click', async () => {
                    if (confirm(`Delete server "${serverData.name}" and all its messages?`)) {
                        await remove(ref(db, `servers/${serverId}`));
                        await remove(ref(db, `serverMessages/${serverId}`));
                        await remove(ref(db, `serverMembers/${serverId}`));
                        joinedServers.delete(serverId);
                        if (currentServerId === serverId) switchServer(null);
                        renderSidebarLists();
                        alert('Server deleted.');
                    }
                    menu.remove();
                });
                menu.appendChild(deleteBtn);
            }

            if (canToggle) {
                const toggleBtn = document.createElement('button');
                toggleBtn.textContent = serverData.public ? '🔒 Make Private' : '🌐 Make Public';
                toggleBtn.addEventListener('click', async () => {
                    const newPublic = !serverData.public;
                    await update(ref(db, `servers/${serverId}`), { public: newPublic });
                    serverData.public = newPublic;
                    joinedServers.set(serverId, serverData);
                    renderSidebarLists();
                    menu.remove();
                });
                menu.appendChild(toggleBtn);
            }

            if (menu.children.length === 0) {
                const noAction = document.createElement('button');
                noAction.textContent = 'No actions available';
                noAction.disabled = true;
                menu.appendChild(noAction);
            }

            document.body.appendChild(menu);
            document.addEventListener('click', function closeMenu(e) {
                if (!menu.contains(e.target)) {
                    menu.remove();
                    document.removeEventListener('click', closeMenu);
                }
            });
        }

                    if (members && members[currentUser]) {
