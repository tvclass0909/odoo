            wordsDiv.innerHTML = '';
            blockedWords.forEach(w => {
                const badge = document.createElement('div');
                badge.className = 'word-badge';
                badge.innerHTML = `${escapeHtml(w)} <button class="remove-word">✖</button>`;
                badge.querySelector('.remove-word').onclick = () => {
                    blockedWords.delete(w);
                    set(ref(db, 'adminConfig/blockedWords'), Array.from(blockedWords));
                    renderBlocked();
                };
                wordsDiv.appendChild(badge);
            });
        }
    }

    // ---------- SERVER FUNCTIONS ----------
    function generateServerCode() {
        return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    async function joinServerById(serverId, serverData) {
        if (joinedServers.has(serverId)) return;
        joinedServers.set(serverId, serverData);
        await set(ref(db, `serverMembers/${serverId}/${currentUser}`), true);
        renderSidebarLists();
        if (!currentServerId && !currentDmId) switchServer(serverId);
    }

    async function switchServer(serverId) {
        if (activeMessageListener) {
            activeMessageListener();
            activeMessageListener = null;
        }
        messagesDiv.innerHTML = '';
        messageElements.clear();
        currentDmId = null;
        currentDmPartner = null;

        currentServerId = serverId;
        if (!serverId) {
            currentServerLabel.textContent = '💬 GLOBAL NEXUS';
            const unsubAdded = onChildAdded(messagesRef, async (snap) => {
                await loadProfiles();
                renderMessage(snap.key, snap.val());
            });
            const unsubRemoved = onChildRemoved(messagesRef, (snap) => {
                const el = messageElements.get(snap.key);
                if (el) el.remove();
                messageElements.delete(snap.key);
            });
            activeMessageListener = () => { unsubAdded(); unsubRemoved(); };
            const snap = await get(messagesRef);
            snap.forEach(c => renderMessage(c.key, c.val()));
        } else {
            const server = joinedServers.get(serverId);
            currentServerLabel.textContent = `🌐 ${server?.name || 'Server'}`;
            const msgsRef = ref(db, `serverMessages/${serverId}`);
            const unsubAdded = onChildAdded(msgsRef, async (snap) => {
                await loadProfiles();
                renderMessage(snap.key, snap.val());
            });
            const unsubRemoved = onChildRemoved(msgsRef, (snap) => {
                const el = messageElements.get(snap.key);
                if (el) el.remove();
                messageElements.delete(snap.key);
            });
            activeMessageListener = () => { unsubAdded(); unsubRemoved(); };
            const snap = await get(msgsRef);
            snap.forEach(c => renderMessage(c.key, c.val()));
        }
        renderSidebarLists();
    }

    async function renderServerList() {
        serverListDiv.innerHTML = '';
        const globalDiv = document.createElement('div');
        globalDiv.className = 'server-item' + (!currentServerId && !currentDmId ? ' active' : '');
        globalDiv.innerHTML = `<span class="server-icon">🌍</span><span class="server-name">Global Nexus</span>`;
        globalDiv.addEventListener('click', () => switchServer(null));
        serverListDiv.appendChild(globalDiv);

        for (let [id, data] of joinedServers) {
            const div = document.createElement('div');
            div.className = 'server-item' + (currentServerId === id ? ' active' : '');
            div.innerHTML = `<span class="server-icon">📌</span><span class="server-name">${escapeHtml(data.name)}</span>`;
            // Add "..." menu trigger
            const menuTrigger = document.createElement('span');
            menuTrigger.className = 'server-menu-trigger';
            menuTrigger.textContent = '⋯';
            menuTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                showServerContextMenu(e, id, data);
            });
            div.appendChild(menuTrigger);
            div.addEventListener('click', (e) => {
                if (e.target === menuTrigger) return;
                switchServer(id);
            });
            serverListDiv.appendChild(div);
        }
        loadPublicServers();
    }

    async function loadPublicServers() {
        publicServersArea.innerHTML = '<div style="font-size:11px;">Public servers:</div>';
        const snap = await get(serversRef);
        if (snap.exists()) {
            snap.forEach(child => {
                const server = child.val();
                if (server.public && !joinedServers.has(child.key)) {
                    const btn = document.createElement('button');
                    btn.className = 'sidebar-btn';
                    btn.style.fontSize = '11px';
                    btn.style.padding = '4px 8px';
                    btn.style.margin = '2px';
                    btn.textContent = server.name;
                    btn.addEventListener('click', async () => {
                        await joinServerById(child.key, server);
                        await switchServer(child.key);
                    });
                    publicServersArea.appendChild(btn);
                }
            });
        }
        if (publicServersArea.children.length === 1) {
            publicServersArea.innerHTML += '<div style="font-size:11px; opacity:0.6;">No public servers available.</div>';
        }
    }

    function showServerContextMenu(event, serverId, serverData) {
        document.querySelectorAll('.context-menu').forEach(m => m.remove());

        const menu = document.createElement('div');
        menu.className = 'context-menu';
        menu.style.left = `${event.clientX}px`;
        menu.style.top = `${event.clientY}px`;

        const canDelete = userRole === 'admin' || currentUser === serverData.createdBy || hasPermission('deleteUserMsgs');
        const canToggle = userRole === 'admin' || currentUser === serverData.createdBy;

        if (canDelete) {
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = '🗑️ Delete Chat';
            deleteBtn.addEventListener('click', async () => {
                if (confirm(`Delete server "${serverData.name}" and all its messages?`)) {
                    await remove(ref(db, `servers/${serverId}`));
                    await remove(ref(db, `serverMessages/${serverId}`));
                    await remove(ref(db, `serverMembers/${serverId}`));
                    joinedServers.delete(serverId);
                    if (currentServerId === serverId) switchServer(null);
                    renderSidebarLists();
                    alert('Server deleted.');
                }
                menu.remove();
            });
            menu.appendChild(deleteBtn);
        }

        if (canToggle) {
            const toggleBtn = document.createElement('button');
            toggleBtn.textContent = serverData.public ? '🔒 Make Private' : '🌐 Make Public';
            toggleBtn.addEventListener('click', async () => {
                const newPublic = !serverData.public;
                await update(ref(db, `servers/${serverId}`), { public: newPublic });
                serverData.public = newPublic;
                joinedServers.set(serverId, serverData);
                renderSidebarLists();
                menu.remove();
            });
            menu.appendChild(toggleBtn);
        }

        if (menu.children.length === 0) {
            const noAction = document.createElement('button');
            noAction.textContent = 'No actions available';
            noAction.disabled = true;
            menu.appendChild(noAction);
        }

        document.body.appendChild(menu);
        document.addEventListener('click', function closeMenu(e) {
            if (!menu.contains(e.target)) {
                menu.remove();
                document.removeEventListener('click', closeMenu);
            }
        });
    }

    createServerBtn.addEventListener('click', () => {
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `
            <div class="server-modal">
                <h3>✨ Create Server</h3>
                <input type="text" id="server-name-input" placeholder="Server name" class="admin-input">
                <input type="text" id="server-code-input" placeholder="Custom code (optional)" class="admin-input">
                <div class="permission-toggle"><label>Public</label><label class="toggle-switch"><input type="checkbox" id="public-toggle"><span class="slider"></span></label></div>
                <div class="modal-buttons">
                    <button id="create-server-submit" class="save-btn">Create</button>
                    <button id="create-server-cancel" class="cancel-btn">Cancel</button>
                </div>
            </div>
        `;
        document.body.appendChild(overlay);

        const nameInput = overlay.querySelector('#server-name-input');
        const codeInput = overlay.querySelector('#server-code-input');
        const publicToggle = overlay.querySelector('#public-toggle');
        const submitBtn = overlay.querySelector('#create-server-submit');
        const cancelBtn = overlay.querySelector('#create-server-cancel');

        cancelBtn.addEventListener('click', () => overlay.remove());
        submitBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            if (!name) return alert('Name required');
            let code = codeInput.value.trim().toUpperCase();
            if (!code) code = generateServerCode();

            const snap = await get(serversRef);
            let codeTaken = false;
            if (snap.exists()) {
                snap.forEach(child => {
                    if (child.val().code === code) codeTaken = true;
                });
            }
            if (codeTaken) return alert('Server code already taken.');

            const serverData = {
                name,
                code,
                public: publicToggle.checked,
                createdBy: currentUser,
                createdAt: Date.now()
            };
            const newServerRef = push(serversRef);
            await set(newServerRef, serverData);
            const serverId = newServerRef.key;
            await joinServerById(serverId, serverData);
            overlay.remove();
            switchServer(serverId);
        });
    });

    joinServerBtn.addEventListener('click', async () => {
        const code = await showPasswordModal('Join Server', 'Enter server code:');
        if (!code) return;
        const snap = await get(serversRef);
        let targetServerId = null, targetServerData = null;
        if (snap.exists()) {
            snap.forEach(child => {
                if (child.val().code === code.toUpperCase()) {
                    targetServerId = child.key;
                    targetServerData = child.val();
                }
            });
        }
        if (!targetServerId) return alert('Server not found.');
        await joinServerById(targetServerId, targetServerData);
        switchServer(targetServerId);
    });

    // ---------- DIRECT MESSAGES ----------
    function getDmId(userA, userB) {
        return [userA, userB].sort().join('_');
    }

    async function switchToDM(dmId, partnerUsername) {
        if (activeMessageListener) {
            activeMessageListener();
            activeMessageListener = null;
        }
        messagesDiv.innerHTML = '';
        messageElements.clear();
        currentServerId = null;
        currentDmId = dmId;
        currentDmPartner = partnerUsername;
        currentServerLabel.textContent = `💬 DM with ${escapeHtml(partnerUsername)}`;

        const dmMsgsRef = ref(db, `directMessages/${dmId}/messages`);
        const unsubAdded = onChildAdded(dmMsgsRef, async (snap) => {
            await loadProfiles();
            renderMessage(snap.key, snap.val());
        });
        const unsubRemoved = onChildRemoved(dmMsgsRef, (snap) => {
            const el = messageElements.get(snap.key);
            if (el) el.remove();
            messageElements.delete(snap.key);
        });
        activeMessageListener = () => { unsubAdded(); unsubRemoved(); };
        const snap = await get(dmMsgsRef);
        snap.forEach(c => renderMessage(c.key, c.val()));

        renderSidebarLists();
    }

    async function openDirectMessage(username) {
        if (username === currentUser) return alert('You cannot DM yourself.');
        const dmId = getDmId(currentUser, username);
        await set(ref(db, `directMessages/${dmId}/members/${currentUser}`), true);
        await set(ref(db, `directMessages/${dmId}/members/${username}`), true);
        switchToDM(dmId, username);
        document.querySelector('.profile-popup')?.remove();
    }

    // Real-time DM list listener (fixes the missing DM bug)
    function listenToDirectMessages() {
        onValue(directMessagesRef, async (snap) => {
            await renderDmList();
        });
    }

    async function renderDmList() {
        if (!dmListDiv) return;
        dmListDiv.innerHTML = '';
        const dmSnap = await get(directMessagesRef);
        if (dmSnap.exists()) {
            const entries = [];
            dmSnap.forEach(child => entries.push({ id: child.key, data: child.val() }));
            for (const entry of entries) {
                const members = entry.data.members;
                if (members && members[currentUser]) {
                    const partners = Object.keys(members).filter(u => u !== currentUser);
                    if (partners.length > 0) {
                        const partner = partners[0];
                        const div = document.createElement('div');
                        div.className = 'direct-message-item' + (currentDmId === entry.id ? ' active' : '');
                        div.innerHTML = `<span class="dm-icon">✉️</span><span class="dm-partner">${escapeHtml(partner)}</span>`;
                        div.addEventListener('click', () => switchToDM(entry.id, partner));
                        dmListDiv.appendChild(div);
                    }
                }
            }
        }
        if (dmListDiv.children.length === 0) {
            dmListDiv.innerHTML = '<div style="font-size:11px; opacity:0.6;">No DMs yet</div>';
        }
    }

    async function renderSidebarLists() {
        await renderServerList();
        await renderDmList();
    }

    // GIF modal
    function openGifModal() {
        const existing = document.querySelector('.gif-modal-overlay');
        if (existing) existing.remove();

        const overlay = document.createElement('div');
        overlay.className = 'gif-modal-overlay';
        overlay.innerHTML = `
            <div class="gif-modal">
                <h3>🔍 Search Tenor GIFs</h3>
                <div class="gif-search">
                    <input type="text" id="gif-search-input" placeholder="Search GIFs...">
                    <button id="gif-search-btn">Search</button>
                </div>
                <div class="gif-grid" id="gif-grid"></div>
                <button id="close-gif-modal" class="admin-btn" style="margin-top:12px;">Close</button>
            </div>
        `;
        document.body.appendChild(overlay);

        const searchInput = overlay.querySelector('#gif-search-input');
        const searchBtn = overlay.querySelector('#gif-search-btn');
        const grid = overlay.querySelector('#gif-grid');
        const closeBtn = overlay.querySelector('#close-gif-modal');

        async function searchGifs(query) {
            grid.innerHTML = '<p style="color:var(--cyan);">Loading...</p>';
            try {
                const res = await fetch(`${TENOR_SEARCH_URL}?q=${encodeURIComponent(query)}&key=${TENOR_API_KEY}&limit=20`);
                const data = await res.json();
                grid.innerHTML = '';
                if (data.results && data.results.length > 0) {
                    data.results.forEach(gif => {
                        const img = document.createElement('img');
                        img.src = gif.media[0].tinygif.url;
                        img.alt = gif.title;
                        const item = document.createElement('div');
                        item.className = 'gif-item';
                        item.appendChild(img);
                        item.addEventListener('click', () => {
                            sendGif(gif.media[0].gif.url);
                            overlay.remove();
                        });
                        grid.appendChild(item);
                    });
                } else {
                    grid.innerHTML = '<p>No GIFs found.</p>';
                }
            } catch (err) {
                grid.innerHTML = '<p>Error loading GIFs.</p>';
                console.error(err);
            }
        }

        searchBtn.addEventListener('click', () => {
            const query = searchInput.value.trim();
            if (query) searchGifs(query);
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchBtn.click();
        });

        closeBtn.addEventListener('click', () => overlay.remove());
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) overlay.remove();
        });

        searchGifs('trending');
    }

    async function sendGif(url) {
        if (isChatPaused && userRole !== 'admin' && !hasPermission('pauseChat')) return alert('Chat paused');
        if (blockedNames.has(currentUser) && userRole !== 'admin') return alert('You are blocked');
        const targetRef = currentDmId ? ref(db, `directMessages/${currentDmId}/messages`) : (currentServerId ? ref(db, `serverMessages/${currentServerId}`) : messagesRef);
        await push(targetRef, {
            username: currentUser,
            text: '',
            type: 'gif',
            url: url,
            time: Date.now()
        });
    }

    // Attachment handling
    attachBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/') && !file.type.startsWith('video/')) {
            alert('Only images and videos are supported.');
            return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
            pendingAttachment = {
                dataURL: ev.target.result,
                type: file.type.startsWith('image/') ? 'image' : 'video'
            };
            showAttachmentPreview();
        };
        reader.readAsDataURL(file);
        fileInput.value = '';
    });

    function showAttachmentPreview() {
        if (!pendingAttachment) {
            attachmentPreviewArea.style.display = 'none';
            attachmentPreviewArea.innerHTML = '';
            return;
        }
        attachmentPreviewArea.style.display = 'flex';
        attachmentPreviewArea.innerHTML = '';
        const previewEl = pendingAttachment.type === 'image' ? document.createElement('img') : document.createElement('video');
        previewEl.src = pendingAttachment.dataURL;
        if (pendingAttachment.type === 'video') {
            previewEl.muted = true;
            previewEl.loop = true;
            previewEl.autoplay = true;
            previewEl.controls = false;
        }
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-preview';
        removeBtn.innerText = '✖';
        removeBtn.onclick = () => {
            pendingAttachment = null;
            showAttachmentPreview();
        };
        attachmentPreviewArea.appendChild(previewEl);
        attachmentPreviewArea.appendChild(removeBtn);
    }

    // Send message
    sendBtn.onclick = async () => {
        if (!messageInput.value.trim() && !pendingAttachment) return;
        if (isChatPaused && userRole !== 'admin' && !hasPermission('pauseChat')) return alert('Chat paused');
        if (blockedNames.has(currentUser) && userRole !== 'admin') return alert('You are blocked');

        let messageData = { username: currentUser, time: Date.now() };
        if (pendingAttachment) {
            messageData.type = pendingAttachment.type;
            messageData.url = pendingAttachment.dataURL;
            messageData.text = '';
            pendingAttachment = null;
            showAttachmentPreview();
        } else {
            let text = messageInput.value.trim();
            for (let w of blockedWords) text = text.replace(new RegExp(`\\b${escapeRegex(w)}\\b`, 'gi'), '█'.repeat(w.length));
            messageData.type = 'text';
            messageData.text = text;
        }
        const targetRef = currentDmId ? ref(db, `directMessages/${currentDmId}/messages`) : (currentServerId ? ref(db, `serverMessages/${currentServerId}`) : messagesRef);
        await push(targetRef, messageData);
        messageInput.value = '';
        set(ref(db, `typing/${currentUser}`), null);
    };

    messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendBtn.click(); });
    accountBtn.onclick = openAccountModal;
    adminPanelToggle.onclick = () => adminDrawer.classList.toggle('open');
    modPanelToggle.onclick = () => adminDrawer.classList.toggle('open');
    starToggle.onclick = () => { if (userRole === 'admin') { isAdminMode = !isAdminMode; starToggle.classList.toggle('star-active'); } };
    gifBtn.addEventListener('click', openGifModal);

    function listenToProfiles() {
        onValue(usersRef, (snap) => {
            userProfiles.clear();
            if (snap.exists()) snap.forEach(child => userProfiles.set(child.key, child.val()));
            messagesDiv.innerHTML = '';
            messageElements.clear();
            const targetRef = currentDmId ? ref(db, `directMessages/${currentDmId}/messages`) : (currentServerId ? ref(db, `serverMessages/${currentServerId}`) : messagesRef);
            get(targetRef).then(msgsSnap => msgsSnap.forEach(c => renderMessage(c.key, c.val())));
            updateOnlineList();
        });
    }

    function listenToModerators() {
        onValue(moderatorsRef, (snap) => {
            moderatorUsernames.clear();
            if (snap.exists()) snap.forEach(child => moderatorUsernames.add(child.key));
            messagesDiv.innerHTML = '';
            messageElements.clear();
            const targetRef = currentDmId ? ref(db, `directMessages/${currentDmId}/messages`) : (currentServerId ? ref(db, `serverMessages/${currentServerId}`) : messagesRef);
            get(targetRef).then(msgsSnap => msgsSnap.forEach(c => renderMessage(c.key, c.val())));
            updateOnlineList();
        });
    }

    // Login
    document.getElementById('login-btn').onclick = async () => {
        const name = document.getElementById('login-name').value.trim();
        if (!name) { document.getElementById('error-msg').innerText = 'Enter a name!'; return; }

        const modSnap = await get(ref(db, `moderators/${name}`));
        if (modSnap.exists()) {
            const password = await showPasswordModal('Moderator Login', `Enter password for @${name}:`);
            if (!password || password !== modSnap.val().password) {
                document.getElementById('error-msg').innerText = 'Invalid moderator password.';
                return;
            }
            currentUser = name;
            userRole = 'moderator';
            modPermissions = modSnap.val().permissions || {};
            currentUserProfile = getProfile(name) || { name: currentUser, avatarColor: '#00e5ff', avatarUrl: null };
            await saveProfile(currentUser, currentUserProfile);
        } else if (name === 'Johan06') {
            const code = await showPasswordModal('Admin Login', 'Enter the master code:');
            if (code !== 'PurpleMania') { document.getElementById('error-msg').innerText = 'Invalid admin code.'; return; }
            currentUser = name;
            userRole = 'admin';
            currentUserProfile = { name: currentUser, avatarColor: '#ffd700', avatarUrl: null };
            await saveProfile(currentUser, currentUserProfile);
        } else {
            const snap = await get(messagesRef);
            let taken = false;
            snap.forEach(c => { if (c.val().username === name) taken = true; });
            if (taken) { document.getElementById('error-msg').innerText = 'Name taken!'; return; }
            currentUser = name;
            userRole = 'user';
            currentUserProfile = { name: currentUser, avatarColor: '#9b30ff', avatarUrl: null };
            await saveProfile(currentUser, currentUserProfile);
        }

        loginScreen.style.display = 'none';
        chatApp.style.display = 'flex';

        if (userRole === 'admin') {
            starToggle.style.display = 'flex';
            starToggle.classList.add('star-active');
            isAdminMode = true;
        } else {
            starToggle.style.display = 'none';
            isAdminMode = false;
        }
        adminPanelToggle.style.display = (userRole === 'admin') ? 'flex' : 'none';
        modPanelToggle.style.display = (userRole === 'moderator') ? 'flex' : 'none';

        await loadProfiles();
        const config = await get(adminConfigRef);
        if (config.exists()) {
            if (config.val().blockedNames) blockedNames = new Set(config.val().blockedNames);
            if (config.val().blockedWords) blockedWords = new Set(config.val().blockedWords);
            if (typeof config.val().chatPaused === 'boolean') isChatPaused = config.val().chatPaused;
        }

        const initModSnap = await get(moderatorsRef);
        moderatorUsernames.clear();
        if (initModSnap.exists()) initModSnap.forEach(child => moderatorUsernames.add(child.key));

        const memberSnap = await get(serverMembersRef);
        if (memberSnap.exists()) {
            for (const [serverId, members] of Object.entries(memberSnap.val())) {
                if (members[currentUser]) {
                    const serverDataSnap = await get(ref(db, `servers/${serverId}`));
                    if (serverDataSnap.exists()) {
                        joinedServers.set(serverId, serverDataSnap.val());
                    }
                }
            }
        }

        // Start real-time DM listener (fixes the missing DM bug)
        listenToDirectMessages();

        await renderSidebarLists();
        switchServer(null);

        listenToProfiles();
        listenToModerators();
        initPresence();
        buildAdminDrawer();

        const pauseBtn = document.getElementById('pause-chat-btn');
        if (pauseBtn) pauseBtn.innerText = isChatPaused ? '▶️ RESUME' : '⏸️ PAUSE';
    };

    onValue(adminConfigRef, (snap) => {
        if (snap.exists()) {
            if (snap.val().blockedNames) blockedNames = new Set(snap.val().blockedNames);
            if (snap.val().blockedWords) blockedWords = new Set(snap.val().blockedWords);
            if (typeof snap.val().chatPaused === 'boolean') isChatPaused = snap.val().chatPaused;
            renderBlocked();
            const pauseBtn = document.getElementById('pause-chat-btn');
            if (pauseBtn) pauseBtn.innerText = isChatPaused ? '▶️ RESUME' : '⏸️ PAUSE';
        }
    });

    onValue(ref(db, '.info/connected'), (snap) => {
        statusSpan.innerText = snap.val() ? '✨ ONLINE ✨' : '🌙 OFFLINE';
    });
</script>
</body>
</html>
